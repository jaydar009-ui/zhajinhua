<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扑克牌实时识别 V1</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:#f5f7fa;margin:0;padding:16px}main{max-width:680px;margin:auto}button,input,select{font-size:16px;padding:10px;border-radius:9px}button{background:#7456ed;color:white;border:0;margin:5px 5px 5px 0}button:disabled{opacity:.5}input{max-width:100%;box-sizing:border-box}label{display:block;margin:12px 0}.stage{position:relative}video{width:100%;border-radius:12px;background:#000}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.muted{color:#a9b4c8}pre{white-space:pre-wrap;word-break:break-word;background:#1d293c;padding:12px;border-radius:8px;max-height:230px;overflow:auto}#log{max-height:180px;overflow:auto}a{color:#b7a7ff}</style></head><body><main><h2>🃏 扑克牌实时识别 V1</h2><p class="muted">连续摄像头画面 + Roboflow 云端模型测试。请勿公开你的 API Key。</p><label>Roboflow API Key <input id="key" type="password" placeholder="粘贴你自己的 API Key" autocomplete="off" style="width:100%"></label><label>模型 ID <input id="model" value="playing-cards-ow27d/4" style="width:100%"></label><label>识别间隔 <select id="interval"><option value="500">0.5秒（网络允许时）</option><option value="1000" selected>1秒</option><option value="2000">2秒</option><option value="3000">3秒</option></select></label><label>最低置信度 <input id="threshold" type="range" min="10" max="90" value="35"><span id="tv">35%</span></label><div><button id="start">打开摄像头并开始</button><button id="stop" disabled>停止</button><button id="switch">切换摄像头</button></div><p id="status">状态：未启动</p><div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div><h3>本帧结果</h3><pre id="result">等待识别...</pre><h3>识别记录</h3><pre id="log">暂无</pre><p class="muted">使用 HTTPS 网站打开才能正常请求摄像头；file:// 本地打开通常不行。网络推理可能产生费用，请查看 Roboflow 账户额度。模型和 API Key 请从你自己的 Roboflow 账户确认。</p></main><script>
const $=id=>document.getElementById(id);let stream=null,active=false,busy=false,last=0,facing='environment',runId=0;const video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d'),capture=document.createElement('canvas');$('threshold').oninput=()=> $('tv').textContent=$('threshold').value+'%';function status(s){$('status').textContent='状态：'+s}function draw(preds,w,h){overlay.width=w;overlay.height=h;ctx.lineWidth=Math.max(2,w/300);ctx.font=`${Math.max(15,w/32)}px sans-serif`;for(const p of preds){const x=p.x-p.width/2,y=p.y-p.height/2;ctx.strokeStyle='#45f5aa';ctx.strokeRect(x,y,p.width,p.height);const label=`${p.class} ${Math.round(p.confidence*100)}%`;const tw=ctx.measureText(label).width+10;ctx.fillStyle='#062f27';ctx.fillRect(x,Math.max(0,y-26),tw,26);ctx.fillStyle='#fff';ctx.fillText(label,x+5,Math.max(18,y-7));}}async function openCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();}async function stop(){active=false;runId++;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;ctx.clearRect(0,0,overlay.width,overlay.height);$('start').disabled=false;$('stop').disabled=true;status('已停止')}async function start(){if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){status('摄像头不可用：请通过 HTTPS 打开网页，并允许摄像头权限');return}if(!$('key').value.trim()){status('请先填写 Roboflow API Key');return}try{await openCamera();active=true;last=0;runId++;$('start').disabled=true;$('stop').disabled=false;status('摄像头已开启，等待第一帧');loop(runId)}catch(e){status('打开摄像头失败：'+e.message)}}async function loop(id){if(!active||id!==runId)return;const now=performance.now();if(!busy&&video.readyState>=2&&now-last>=Number($('interval').value)){last=now;busy=true;try{const w=640,h=Math.round(video.videoHeight*640/video.videoWidth);capture.width=w;capture.height=h;capture.getContext('2d').drawImage(video,0,0,w,h);const blob=await new Promise(r=>capture.toBlob(r,'image/jpeg',0.75));if(!blob)throw Error('截取画面失败');const key=$('key').value.trim(),model=$('model').value.trim();if(!/^[a-zA-Z0-9_-]+\/[0-9]+$/.test(model))throw Error('模型 ID 格式应为 项目名/版本号');const endpoint=`https://detect.roboflow.com/${model}?api_key=${encodeURIComponent(key)}&confidence=${Number($('threshold').value)}`;const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:await blobToBase64(blob)});if(!res.ok)throw Error('接口返回 '+res.status+'：'+(await res.text()).slice(0,180));const data=await res.json();if(!active||id!==runId)return;const preds=data.predictions||[];draw(preds,w,h);const msg=preds.length?preds.map(p=>`${p.class} (${Math.round(p.confidence*100)}%)`).join('、'):'本帧没有识别到牌角';$('result').textContent=msg;status('正在识别 · '+new Date().toLocaleTimeString());if(preds.length){$('log').textContent=`${new Date().toLocaleTimeString()}  ${msg}\n`+($('log').textContent==='暂无'?'':$('log').textContent).slice(0,4000)}}catch(e){if(active&&id===runId){status('识别失败：'+e.message);$('result').textContent='检查 API Key、模型 ID、网络及账户额度。'}}finally{busy=false}}if(active&&id===runId)requestAnimationFrame(()=>loop(id))}function blobToBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}$('start').onclick=start;$('stop').onclick=stop;$('switch').onclick=async()=>{facing=facing==='environment'?'user':'environment';if(active){try{await openCamera();status('摄像头已切换')}catch(e){status('切换失败：'+e.message)}}};window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
