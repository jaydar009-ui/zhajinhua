<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V8 扑克牌牌角识别测试</title><style>body{background:#101923;color:#eef6ff;font:16px system-ui;margin:0}main{max-width:760px;margin:auto;padding:16px}.panel{background:#1b2b3a;padding:15px;border-radius:14px;margin:12px 0}button,input{padding:12px;margin:4px;border:0;border-radius:9px;font-size:16px}button{background:#167de1;color:white}canvas{width:100%;background:#07121b;border-radius:10px;touch-action:none}#result{font-size:25px;font-weight:bold}small,p{line-height:1.6;color:#c5d4df}#status{color:#9cdaff}</style></head><body><main><h2>🃏 V8.0 牌角识别实验版</h2><p>不需要手动逐张学习。使用浏览器 OCR 读取可见牌角的字母、数字；花色采用颜色和形状的实验性分类。结果仅供测试。</p><section class="panel"><button id="start">开启后置摄像头</button><button id="stop">停止</button><label>上传照片<input id="file" type="file" accept="image/*"></label><canvas id="view" width="960" height="540"></canvas><p>点击画面中的牌角定位黄色识别框，确保数字和小花色位于框内。</p><label>框宽 <input id="w" type="range" min="45" max="300" value="120"></label><label>框高 <input id="h" type="range" min="65" max="350" value="175"></label></section><section class="panel"><button id="scan">识别当前牌角</button><button id="live">开始连续识别</button><button id="pause">暂停</button><div id="result">等待画面</div><p id="status">准备中</p><div id="log"></div></section><p><small>技术说明：OCR 模型需首次联网加载，依赖 Tesseract.js CDN。不同牌面字体、旋转、模糊及低分辨率可能无法识别。没有看见牌角时不推测隐藏牌。花色判断是启发式实验功能，不是经过验证的52类模型。</small></p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id),cv=$('view'),ctx=cv.getContext('2d',{willReadFrequently:true}),off=document.createElement('canvas'),oc=off.getContext('2d',{willReadFrequently:true});off.width=960;off.height=540;let video=null,stream=null,photo=null,worker=null,busy=false,running=false,last='',votes=[];let roi={x:420,y:175,w:120,h:175};function status(s){$('status').textContent=s}function frame(){if(video&&video.readyState>=2)oc.drawImage(video,0,0,960,540);else if(photo)oc.drawImage(photo,0,0,960,540);ctx.drawImage(off,0,0);ctx.strokeStyle='#ffe34d';ctx.lineWidth=4;ctx.strokeRect(roi.x,roi.y,roi.w,roi.h);requestAnimationFrame(frame)}frame();function center(x,y){roi.x=Math.max(0,Math.min(960-roi.w,x-roi.w/2));roi.y=Math.max(0,Math.min(540-roi.h,y-roi.h/2))}cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect();center((e.clientX-r.left)*960/r.width,(e.clientY-r.top)*540/r.height)});function resize(){let x=roi.x+roi.w/2,y=roi.y+roi.h/2;roi.w=+$('w').value;roi.h=+$('h').value;center(x,y)}$('w').oninput=resize;$('h').oninput=resize;
$('start').onclick=async()=>{try{stream?.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video=document.createElement('video');video.srcObject=stream;video.playsInline=true;video.muted=true;await video.play();photo=null;status('摄像头已开启')}catch(e){status('无法开启摄像头：'+e.message+'；请使用 HTTPS 并检查权限')}};$('stop').onclick=()=>{running=false;stream?.getTracks().forEach(t=>t.stop());stream=null;video=null;status('摄像头已停止')};$('file').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;video=null;photo=im;URL.revokeObjectURL(url);status('照片已加载')};im.src=url};
async function init(){if(worker)return worker;if(!window.Tesseract)throw Error('OCR 库加载失败，请检查网络');status('首次加载 OCR 模型，请稍候…');worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='loading language traineddata')status('下载 OCR 语言数据 '+Math.round((m.progress||0)*100)+'%')}});await worker.setParameters({tessedit_char_whitelist:'A234567890JQK10',tessedit_pageseg_mode:Tesseract.PSM.SINGLE_WORD});return worker}
function crop(){let c=document.createElement('canvas');c.width=roi.w*3;c.height=roi.h*3;let p=c.getContext('2d',{willReadFrequently:true});p.imageSmoothingEnabled=true;p.drawImage(off,roi.x,roi.y,roi.w,roi.h,0,0,c.width,c.height);return c}function rank(s){s=(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');let m=s.match(/10|[A23456789JQK]/);return m?m[0]:null}
// 仅在牌角下半区域估计红/黑。红色仍不能区分红桃与方块，黑色仍不能区分黑桃与梅花。
function colorHint(c){let p=c.getContext('2d'),w=c.width,h=c.height,d=p.getImageData(0,Math.floor(h*.35),w,Math.floor(h*.6)).data,red=0,dark=0;for(let i=0;i<d.length;i+=16){let r=d[i],g=d[i+1],b=d[i+2];if(r>65&&r>g*1.4&&r>b*1.25)red++;if(r<115&&g<115&&b<115)dark++}return red>Math.max(12,dark*.12)?'红色（♥/♦ 未区分）':dark>15?'黑色（♠/♣ 未区分）':'花色未知'}
async function scan(){if(busy||(!video&&!photo))return;busy=true;try{await init();let c=crop(),best=null;for(let angle of [0,180]){let q=document.createElement('canvas');q.width=c.width;q.height=c.height;let p=q.getContext('2d');p.translate(q.width/2,q.height/2);p.rotate(angle*Math.PI/180);p.drawImage(c,-c.width/2,-c.height/2);let res=await worker.recognize(q),r=rank(res.data.text),confidence=res.data.confidence||0;if(r&&(!best||confidence>best.confidence))best={r,confidence}}let hint=colorHint(c);let value=best&&best.confidence>=40?best.r+' · '+hint:null;votes.push(value);if(votes.length>5)votes.shift();let counts={};votes.filter(Boolean).forEach(v=>counts[v]=(counts[v]||0)+1);let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];let stable=top&&top[1]>=3;$('result').textContent=stable?top[0]:value?'候选：'+value:'未识别，请调整牌角';status('OCR '+(best?best.confidence.toFixed(0)+'%':'无结果')+'；花色未完整识别');if(stable&&last!==top[0]){last=top[0];let div=document.createElement('div');div.textContent=new Date().toLocaleTimeString()+' '+top[0];$('log').prepend(div)}}catch(e){status('识别失败：'+e.message)}finally{busy=false}}$('scan').onclick=()=>{votes=[];scan()};$('live').onclick=async()=>{if(running)return;running=true;status('连续识别中');while(running){await scan();await new Promise(r=>setTimeout(r,120))}};$('pause').onclick=()=>{running=false;status('已暂停')};
</script></body></html>
